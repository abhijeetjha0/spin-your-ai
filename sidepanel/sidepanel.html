<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spin Your AI</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header glassmorphism">
      <div class="logo">
        <img src="../icons/icon-48.png" alt="Logo" class="logo-icon">
        <span class="logo-text">Spin Your AI</span>
      </div>
      <div class="header-actions">
        <select id="model-selector" class="model-dropdown">
          <option value="" disabled selected>Select Model...</option>
        </select>
        <button id="options-btn" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <main class="chat-area" id="chat-container">
      <div class="message system-msg">
        Welcome to Spin Your AI! Select a model and start chatting.
      </div>
      <!-- Messages will be appended here -->
    </main>

    <footer class="input-area glassmorphism">
      <div class="context-toggle">
        <label class="toggle-pill">
          <input type="checkbox" id="include-page-context">
          <span class="pill-text">📄 Include page content</span>
        </label>
      </div>
      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="Ask anything..." rows="1"></textarea>
        <button id="send-btn" class="send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
        <button id="stop-btn" class="stop-btn hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg>
        </button>
      </div>
    </footer>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
